query CartInput {
  shop {
    goals: metafield(namespace: "zuper_threshold", key: "goals") {
      value
      type
    }
  }
  cart {
    lines {
      id
      cost {
        subtotalAmount {
          amount
        }
      }
      merchandise {
        ... on ProductVariant {
          product {
            id
          }
        }
      }
    }
  }
  discount {
    discountClasses
  }
}
